name: 📝 Generate & Deploy Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'docs/website/**'
      - 'luau-api/**'
  workflow_dispatch:

permissions:
  id-token: write
  pages: write

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
    generate_docs:
        name: 📝 Generating documentation
        runs-on: ubuntu-latest
        environment:
          name: github-pages
          url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - uses: actions/checkout@v6
              name: 📂 Checkout
              with:
                lfs: true

            - name: 🏷️ Fetch the latest release tag
              run: |
                # The reference is also generated for the latest x.y.z tag: fetch only that tag, without its history.
                TAG=$(git ls-remote --tags --refs origin | sed 's#.*refs/tags/##' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
                git fetch --depth=1 origin "refs/tags/${TAG}:refs/tags/${TAG}"

            - uses: actions/setup-node@v3
              name: ⚙️ Setup Node.js
              with:
                node-version: 24

            - uses: pnpm/action-setup@v4
              name: ⚙️ Setup pnpm
              with:
                version: 10

            - name: ⬇️ Install dependencies
              run: |
                cd docs/website
                pnpm install

            - name: 🏗️ Build
              run: |
                cd docs/website
                pnpm build

            - name: 🔍 Check that the generated reference is up to date
              run: |
                # pnpm build regenerates the reference from luau-api. If that changed anything,
                # the reference was not regenerated and committed after editing luau-api.
                if [ -n "$(git status --porcelain -- docs/website/src/content/docs/references)" ]; then
                  echo "::error::The reference pages are out of date. Run 'pnpm references' in docs/website and commit the result."
                  git status --porcelain -- docs/website/src/content/docs/references
                  git --no-pager diff -- docs/website/src/content/docs/references
                  exit 1
                fi

            - name: ⬆️ Upload static files as artifact
              uses: actions/upload-pages-artifact@v3
              with:
                path: docs/website/dist/

            - name: 🚀 Deploy to vectarineengine.com
              id: deployment
              env:
                CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
              run: |
                pnpx wrangler pages deploy docs/website/dist/ --project-name=vectarine

