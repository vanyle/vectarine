name: 📝 Generate & Deploy Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'docs/website/**'
  workflow_dispatch:

permissions:
  id-token: write
  pages: write

env:
  CARGO_TERM_COLOR: always

jobs:
    generate_docs:
        name: 📝 Generating documentation
        runs-on: ubuntu-latest
        environment:
          name: github-pages
          url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - uses: actions/checkout@v6
              name: 📂 Checkout
              with:
                lfs: true

            - uses: actions/setup-node@v3
              name: ⚙️ Setup Node.js
              with:
                node-version: 24

            - uses: pnpm/action-setup@v4
              name: ⚙️ Setup pnpm
              with:
                version: 10

            - name: ⬇️ Install dependencies
              run: |
                cd docs/website
                pnpm install

            - name: 🏗️ Build
              run: |
                cd docs/website
                pnpm build

            - name: ⬆️ Upload static files as artifact
              uses: actions/upload-pages-artifact@v3
              with:
                path: docs/website/dist/

            - name: 🚀 Deploy to vectarineengine.com
              id: deployment
              env:
                CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
              run: |
                pnpx wrangler pages deploy docs/website/dist/ --project-name=vectarine

