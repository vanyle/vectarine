[project]
path = "../../gallery/Sokoban/game.vecta"
description = "Sokoban runs without errors"

[[step]]
wait_for_frames = 10

[[step]]
compare_screenshot_to = "./sokoban-screenshot.png"

[[step]]
press_keys = ["B"]

[[step]]
wait_for_frames = 3

[[step]]
release_keys = ["B"]

[[step]]
start_benchmark = { name = "Idle", max_allowed_duration = "600 ms" }

[[step]]
wait_for_frames = 200

[[step]]
stop_benchmark = { name = "Idle" }

[[step]]
compare_screenshot_to = "./sokoban-dialog-screenshot.png"

[[step]]
expect_no_errors = {}
